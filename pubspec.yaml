name: docbubble
description: "DocBubble — PDF Scanner & Tools by Bubblesort"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # PDF operations
  syncfusion_flutter_pdf: ^27.1.48
  syncfusion_flutter_pdfviewer: ^27.1.48

  # Camera & Scanner
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_document_scanner: ^0.1.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File management
  path_provider: ^2.1.4
  file_picker: ^8.1.3
  image_picker: ^1.1.2
  open_filex: ^4.4.0

  # Sharing
  share_plus: ^10.0.0
  url_launcher: ^6.3.1

  # Fonts & Icons
  google_fonts: ^6.2.1
  iconsax: ^0.0.8

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.3

  # Image processing
  image: ^4.2.0
  flutter_image_compress: ^2.3.0

  # QR code
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ^2.0.5

  # Printing
  printing: ^5.13.2

  # Permissions
  permission_handler: ^11.3.1

  # UI utilities
  flutter_staggered_grid_view: ^0.7.0
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.2.0+3
  intl: ^0.19.0
  uuid: ^4.4.2
  crypto: ^3.0.5
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
